name: Build STRANGER PRO APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Init submodules - REAL engines (Dexed, Surge, OB-Xd, Oboe)
        run: |
          rm -rf app/src/main/cpp/oboe app/src/main/cpp/dexed app/src/main/cpp/surge app/src/main/cpp/obxd
          git clone --depth 1 https://github.com/google/oboe.git app/src/main/cpp/oboe
          git clone --depth 1 https://github.com/asb2m10/dexed.git app/src/main/cpp/dexed
          git clone --depth 1 https://github.com/surge-synthesizer/surge.git app/src/main/cpp/surge
          git clone --depth 1 https://github.com/2DaT/Obxd.git app/src/main/cpp/obxd
          ls -la app/src/main/cpp/

      - name: Grant gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace || gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STRANGER-PRO-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload - Real engines info
        run: |
          echo "Dexed = 6-op FM, 32 algos, real DX7"
          echo "Surge XT = wavetable + dual filters"
          echo "OB-Xd = analog ladder bass"
